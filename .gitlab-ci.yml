############
# Settings #
############
image: docker:29.4.3
services:
  - docker:29.4.3-dind
stages:
  - template
  - run
variables:
  BASE_TAG: "develop"
  USE_PRIVATE_IMAGES: 0
  KASM_RELEASE: "1.18.0"
  TEST_INSTALLER: "https://kasm-static-content.s3.amazonaws.com/kasm_release_1.18.0.09f70a.tar.gz"
  # Rolling develop Kasm install bundle -- same install.sh-compatible tarball
  # shape as TEST_INSTALLER above, but tracking kasm_backend's develop branch
  # instead of a pinned release. Used only for the Playwright calibration
  # path (see ci-scripts/test.sh): calibration needs the post-1.19.0 API/UI
  # changes the DEVOPS-74 Playwright specs depend on, which the pinned
  # release above doesn't have. Kept as a separate variable, not a change to
  # TEST_INSTALLER itself, so Selenium's own calibration against TEST_IMAGES
  # images isn't silently switched to a moving target.
  TEST_INSTALLER_ROLLING: "https://kasmweb-build-artifacts.s3.amazonaws.com/kasm_backend/branches/develop/kasm_workspaces_develop.tar.gz"
  # Ref of the kasmweb repo the Playwright calibration specs are cloned from
  # -- see ci-scripts/test.sh. Pinned explicitly rather than auto-matched by
  # branch name; see the branch-check-stale-backend-branch-match precedent in
  # kasmweb's own CI. DEVOPS-74 (multi-image support / KASM_TEST_IMAGE_REFS)
  # is not on develop yet -- pinned to the feature branch until it merges,
  # then switch this to "develop".
  KASMWEB_VERSION: "feature/DEVOPS-74-multi-image-support-for-image-specs"
  MIRROR_ORG_NAME: "kasmtech"
  DOCKER_AUTH_CONFIG: ${_DOCKER_AUTH_CONFIG}
default:
  retry: 2

# Prevent duplicate pipelines for push events to branches that also have open MRs
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS
      when: never
    - when: always

before_script:
  - export SANITIZED_BRANCH="$(echo $CI_COMMIT_REF_NAME | sed -r 's#^release/##' | sed 's/\//_/g')"

#######################
# Build from template #
#######################
template:
  stage: template
  rules:
    - when: always
  script:
    - apk add py3-jinja2 py3-yaml
    - cd ci-scripts
    - python3 template-gitlab.py
  tags:
    - oci-amd-scheduled
  artifacts:
    paths:
      - gitlab-ci.yml

pipeline:
  stage: run
  rules:
    - if: '$README_USERNAME_RUN || $README_PASSWORD_RUN || $QUAY_API_KEY_RUN || $DOCKERHUB_REVERT_RUN || $REVERT_IS_ROLLING_RUN'
      when: never
    - when: on_success
  variables:
    PARENT_PIPELINE_SOURCE: "$CI_PIPELINE_SOURCE"
    RUN_SET: "$RUN_SET"
  trigger:
    include:
      - artifact: gitlab-ci.yml
        job: template

pipeline_readme:
  stage: run
  only:
    variables:
      - $README_USERNAME_RUN
      - $README_PASSWORD_RUN
  variables:
      README_USERNAME: $README_USERNAME_RUN
      README_PASSWORD: $README_PASSWORD_RUN
  trigger:
    include:
      - artifact: gitlab-ci.yml
        job: template
        
pipeline_readme_quay:
  stage: run
  only:
    variables:
      - $QUAY_API_KEY_RUN
  variables:
      QUAY_API_KEY: $QUAY_API_KEY_RUN
  trigger:
    include:
      - artifact: gitlab-ci.yml
        job: template
        
pipeline_revert:
  stage: run
  only:
    variables:
      - $DOCKERHUB_REVERT_RUN
      - $REVERT_IS_ROLLING_RUN
  variables:
      DOCKERHUB_REVERT: $DOCKERHUB_REVERT_RUN
      REVERT_IS_ROLLING: $REVERT_IS_ROLLING_RUN
  trigger:
    include:
      - artifact: gitlab-ci.yml
        job: template
